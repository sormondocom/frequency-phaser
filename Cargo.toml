[workspace]
members  = ["desktop", "core"]
resolver = "2"

# esp32-fw is excluded: it targets xtensa-esp32-espidf and must be built
# separately with the espup toolchain.  cd esp32-fw && cargo build --release
exclude  = ["esp32-fw"]

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
